[project]
name = "hackathon"
version = "0.1.0"
description = "AI-powered due diligence system for supply chain analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-inference>=1.0.0b9",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.10",
    "langsmith>=0.7.13",
    "pypdf>=6.7.5",
    "surrealdb>=1.0.8",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "langgraph>=0.4.0",
    "tavily-python>=0.5.0",
    "google-search-results>=2.4.2",
    "apify-client>=1.8.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
